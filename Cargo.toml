[workspace]
resolver = "3"
members = ["crates/harness-core", "crates/harness-cli", "crates/harness-gateway"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
harness-core = { path = "crates/harness-core" }
harness-gateway = { path = "crates/harness-gateway" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# OS credential store for the device token (Windows: Credential Manager).
keyring = { version = "3.6", features = ["windows-native", "apple-native", "linux-native"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
toml_edit = "0.25.17"
# Native TLS (SChannel on Windows) instead of rustls/ring, which would need a
# C toolchain for aarch64-pc-windows-msvc.
ureq = { version = "3.4.2", default-features = false, features = ["native-tls", "json"] }
# Pseudo consoles and raw console input for `harness run` (already in the
# lock file through keyring and native-tls).
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[profile.dev]
# Full debug info roughly doubles rustc's memory use; line tables are enough
# for backtraces and keep builds within the little RAM this machine has free.
debug = "line-tables-only"

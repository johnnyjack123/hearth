[workspace]
resolver = "3"
members = ["crates/harness-core", "crates/harness-cli", "crates/harness-gateway", "crates/harness-setup", "crates/harness-vmd"]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
harness-core = { path = "crates/harness-core" }
harness-gateway = { path = "crates/harness-gateway" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# OS credential store for the device token (Windows: Credential Manager).
keyring = { version = "3.6", features = ["windows-native", "apple-native", "linux-native"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
toml_edit = "0.25.17"
# Native TLS (SChannel on Windows) instead of rustls/ring, which would need a
# C toolchain for aarch64-pc-windows-msvc.
ureq = { version = "3.4.2", default-features = false, features = ["native-tls", "json"] }
# WebSocket to the server for `harness connect`, TLS through native-tls like
# ureq (SChannel on Windows, the system's trust store).
tungstenite = { version = "0.30.0", features = ["native-tls"] }
# For the tunnel to a server with its own CA (already in the lock file
# through ureq and tungstenite).
native-tls = "0.2.18"
# Pseudo consoles and raw console input for `harness run`, the tray icon of
# harnessd (already in the lock file through keyring and native-tls).
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
# Full debug info roughly doubles rustc's memory use; line tables are enough
# for backtraces and keep builds within the little RAM this machine has free.
debug = "line-tables-only"

[workspace]
resolver = "3"
members = ["crates/harness-core", "crates/harness-cli", "crates/harness-gateway"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
harness-core = { path = "crates/harness-core" }
harness-gateway = { path = "crates/harness-gateway" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
toml_edit = "0.25.17"

[profile.dev]
# Full debug info roughly doubles rustc's memory use; line tables are enough
# for backtraces and keep builds within the little RAM this machine has free.
debug = "line-tables-only"

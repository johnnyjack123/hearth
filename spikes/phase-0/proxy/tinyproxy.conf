User tinyproxy
Group tinyproxy
Port 8888
Timeout 600
LogLevel Connect
MaxClients 100
# Clients only from container networks
Allow 10.0.0.0/8
Allow 172.16.0.0/12
DisableViaHeader Yes
# Domain allowlist: matched against the request host (also the CONNECT host), no TLS interception
Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes
# Only TLS tunnels via CONNECT
ConnectPort 443

# Server und Web-App von hearth. Einstellungen stehen in .env neben
# dieser Datei (Vorlage: .env.example). Die Daten liegen in ./data (SQLite,
# erzeugtes Geheimnis, Dateien aus Chats) und ./postgres; beide Ordner sichern.
# markitdown wandelt Dokumente (PDF, Word, Excel, PowerPoint) für das Modell
# in Text um; es läuft immer mit, ohne Netz.
#
#   mkdir -p data && sudo chown 1000:1000 data   einmal vorher: der Server läuft als uid 1000
#   docker compose up -d                          mit SQLite in ./data
#   docker compose --profile postgres up -d       zusätzlich Postgres (DATABASE_URL in .env;
#                                                 oder COMPOSE_PROFILES=postgres in .env)
#   docker compose --profile search up -d         zusätzlich SearXNG für die Websuche, dann in
#                                                 der Web-App unter Administration → Server
#                                                 → Websuche: SearXNG, http://searxng:8080
#                                                 (beide Profile: COMPOSE_PROFILES=postgres,search)
#
# Das Image ist privat, solange das Repository privat ist: vorher einmal
#   docker login ghcr.io -u <github-name>     (Token mit read:packages)

services:
  server:
    image: ghcr.io/johnnyjack123/hearth-server:${HEARTH_IMAGE_TAG:-${HARNESS_IMAGE_TAG:-latest}}
    container_name: hearth-server
    restart: unless-stopped
    ports:
      - "${HEARTH_PORT:-${HARNESS_PORT:-8080}}:8080"
    # PUBLIC_URL, HEARTH_SECRET, TRUSTED_ORIGINS, TRUSTED_PROXIES und
    # DATABASE_URL gehen direkt an den Server.
    env_file:
      - path: .env
        required: false
    environment:
      MARKITDOWN_URL: ${MARKITDOWN_URL:-http://markitdown:8080}
    volumes:
      - ./data:/data
    networks: [default, documents]

  # Wandelt hochgeladene Dokumente in Markdown um. Datei-Parser sind
  # Angriffsfläche, deshalb ohne Netz (nur der Server erreicht es), mit
  # schreibgeschütztem Dateisystem, ohne Rechte und mit Speichergrenze.
  markitdown:
    image: ghcr.io/johnnyjack123/hearth-markitdown:${HEARTH_IMAGE_TAG:-${HARNESS_IMAGE_TAG:-latest}}
    container_name: hearth-markitdown
    restart: unless-stopped
    networks: [documents]
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g

  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: hearth-db
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: hearth
      POSTGRES_DB: hearth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - ./postgres:/var/lib/postgresql/data

  # Suchmaschine für den Recherche-Modus. Ohne veröffentlichten Port: Nur der
  # Server erreicht sie, als http://searxng:8080. Die Suchanfragen gehen von
  # hier an Google, Bing, DuckDuckGo usw.
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: hearth-searxng
    profiles: [search]
    restart: unless-stopped
    environment:
      # Eigenes Geheimnis in .env (openssl rand -hex 32). Ohne gilt dieses
      # öffentliche; es schützt nur Einstellungs-Cookies und den Bild-Proxy,
      # und beides nutzt hier niemand.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-hearth-searxng-change-me}
    configs:
      - source: searxng-settings
        target: /etc/searxng/settings.yml

networks:
  # Nur Server und markitdown; ohne Weg nach draußen.
  documents:
    internal: true

configs:
  # JSON-Ausgabe an (ohne sie antwortet SearXNG dem Server mit 403), Limiter
  # und Bild-Proxy aus: Hier fragt nur der eigene Server.
  searxng-settings:
    content: |
      use_default_settings: true
      server:
        limiter: false
        image_proxy: false
      search:
        safe_search: 0
        formats:
          - html
          - json
      # Ab Werk fragt SearXNG nur drei Websuchmaschinen (Google CSE, Brave,
      # DuckDuckGo). Nach vielen Suchen sperren sie den Server für etwa eine
      # Stunde; mit Bing und Yahoo kamen im Test (22.10.2026) trotzdem Treffer.
      # Google direkt und Qwant verweigerten den Zugriff, deshalb fehlen sie.
      engines:
        - name: bing
          disabled: false
        - name: yahoo
          disabled: false

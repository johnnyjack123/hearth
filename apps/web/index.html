<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- resizes-content: the on-screen keyboard shrinks the page instead of
         covering its bottom, so the composer stays above it (Chrome, Firefox). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <title>Hearth</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable as an app (PWA). The colours are the background token in
         each theme; the app replaces them with the theme actually shown. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#fafafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c10" media="(prefers-color-scheme: dark)" />
    <!-- Applies theme and density before first paint; external because the CSP forbids inline scripts. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

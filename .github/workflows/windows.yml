# Builds hearth for Windows (x64 and arm64):
# - hearth-setup-<arch>.exe, the one file to download: it carries the
#   programs below, installs them for the user and runs `hearth setup`;
# - hearth-windows-<arch>.zip with hearth.exe, hearthd.exe (tray and
#   launcher of the background service), hearth-vmd.exe (VM service),
#   hearth-app.exe (desktop app) and install.ps1, for scripted installs.
#
# Runs on version tags, which also publish a release with all four files, and by
# hand (`gh workflow run windows.yml`), which only keeps them as artifacts.
# arm64 is cross-compiled on the x64 runner: the MSVC ARM64 tools are part
# of its Visual Studio, and no dependency compiles C code.
#
# hearth.exe carries the egress gateway for the VM (x64 Windows runs an
# x86_64 VM, arm64 an aarch64 one), built first on Linux with the build stage
# of images/gateway/Containerfile, exactly as the VM would build it. The VM
# then only packs it (images/gateway/Containerfile.prebuilt) and needs
# neither the Rust image nor minutes of compiling.
name: Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: "1.99"
  CARGO_TERM_COLOR: always
  # .cargo/config.toml limits jobs for the RAM of the development machine.
  CARGO_BUILD_JOBS: "4"

jobs:
  gateway:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            vm: x86_64
          - runner: ubuntu-24.04-arm
            vm: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Build like the VM
        run: |
          # The context hearth writes for `hearth image build gateway`.
          context="$RUNNER_TEMP/gateway"
          mkdir -p "$context"
          cp images/gateway/Containerfile images/gateway/Cargo.lock crates/hearth-gateway/Cargo.toml "$context/"
          cp -r crates/hearth-gateway/src "$context/"
          docker build --file "$context/Containerfile" --target build --tag hearth-gateway-build "$context"
          container=$(docker create hearth-gateway-build)
          docker cp "$container:/src/target/release/hearth-gateway" hearth-gateway
          docker rm "$container"
          file hearth-gateway
          ./hearth-gateway --version

      - uses: actions/upload-artifact@v7
        with:
          name: gateway-${{ matrix.vm }}
          path: hearth-gateway
          retention-days: 30

  build:
    needs: gateway
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            vm: x86_64
          - arch: arm64
            target: aarch64-pc-windows-msvc
            vm: aarch64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: gateway-${{ matrix.vm }}
          path: gateway

      - name: Toolchain
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --target ${{ matrix.target }}

      - name: Build
        env:
          # Embedded by crates/hearth-core/build.rs, which checks the architecture.
          HEARTH_GATEWAY_BINARY: ${{ github.workspace }}/gateway/hearth-gateway
        run: cargo build --release --locked --target ${{ matrix.target }} -p hearth-cli -p hearth-vmd -p hearth-app

      - name: Build the installer with these programs inside
        shell: pwsh
        run: |
          $env:HEARTH_BUNDLE_DIR = Join-Path $env:GITHUB_WORKSPACE "target/${{ matrix.target }}/release"
          cargo build --release --locked --target ${{ matrix.target }} -p hearth-setup

      - name: Starts on the runner
        if: matrix.arch == 'x64'
        run: target/${{ matrix.target }}/release/hearth.exe --help

      - name: Package
        shell: pwsh
        run: |
          $name = "hearth-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory $name | Out-Null
          foreach ($exe in 'hearth.exe', 'hearthd.exe', 'hearth-vmd.exe', 'hearth-app.exe') {
            Copy-Item "target/${{ matrix.target }}/release/$exe" $name
          }
          Copy-Item scripts/install.ps1 $name
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
          Copy-Item "target/${{ matrix.target }}/release/hearth-setup.exe" "hearth-setup-${{ matrix.arch }}.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: hearth-windows-${{ matrix.arch }}
          path: |
            hearth-windows-${{ matrix.arch }}.zip
            hearth-setup-${{ matrix.arch }}.exe
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.exe --repo "$GITHUB_REPOSITORY" --clobber

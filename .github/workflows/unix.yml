# Builds, lints and tests the client (hearth, hearthd and the crates they
# use) on Linux and macOS. The development machine is Windows; this is the
# only place macOS compiles at all, and the user's Linux laptop is not
# always on.
name: Unix client

on:
  push:
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/unix.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unix-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml limits jobs for the RAM of the development machine.
  CARGO_BUILD_JOBS: "4"
  # The tests expect German texts (hearth_core::lang).
  HEARTH_LANG: de

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      # The desktop app (winit) links against xkbcommon and xcb on Linux.
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          cargo test --locked --workspace

      - name: Release build
        run: cargo build --locked --release -p hearth-cli -p hearth-app

      - name: Smoke
        run: |
          export HEARTH_HOME="$RUNNER_TEMP/hearth-home"
          ./target/release/hearth --version
          ./target/release/hearth doctor || true
          ./target/release/hearth daemon

      - uses: actions/upload-artifact@v7
        with:
          name: hearth-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/hearth
            target/release/hearthd
            target/release/hearth-app
          retention-days: 14

  # The sandbox on Linux: rootless Podman on the runner, no VM. Runs the
  # tests that need real containers (ignored elsewhere).
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Podman
        run: podman version && podman info --format '{{.Host.NetworkBackend}} {{.Host.Security.Rootless}}'

      - name: Provider
        run: cargo test --locked -p hearth-core --test podman_vm -- --ignored --nocapture

      # Base and gateway image as `hearth setup` builds them (the gateway is
      # compiled in a Rust container here).
      - name: Images
        run: cargo run --locked -p hearth-cli -- image build

      - name: Sync, gateway and instance
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          cargo test --locked -p hearth-core --test sync_vm --test gateway_vm --test instance_vm -- --ignored --test-threads=1

[package]
name = "harness-setup"
description = "One-file installer of llm-harness for Windows: unpacks harness and runs `harness setup`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "llm-harness-setup"
path = "src/main.rs"

# The UI language of Windows (German or English texts).
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true

# App „SQLite“ für den App-Katalog (harness app, Einstellungen im Browser)
name = "sqlite"
title = "SQLite"
description = "Kommandozeile sqlite3 aus Debian"

hosts = ["deb.debian.org"]

path = ["bin"]

install = '''
harness_apt sqlite3
harness_wrap usr/bin
harness_version "$("$PREFIX/bin/sqlite3" --version | cut -d' ' -f1)"
'''

# App „Bun“ für den App-Katalog (harness app, Einstellungen im Browser)
name = "bun"
title = "Bun"
description = "Laufzeit, Paketmanager und Bundler für JavaScript (aktuelle Version)"

hosts = ["github.com", "*.githubusercontent.com"]

# ~/.bun/bin: was der Agent mit `bun add -g` installiert
path = ["bin", "~/.bun/bin"]

install = '''
case "$MACHINE" in
  x86_64) target=bun-linux-x64 ;;
  *) target=bun-linux-$MACHINE ;;
esac
base=https://github.com/oven-sh/bun/releases/latest/download
harness_download "$base/$target.zip" "$WORK/$target.zip"
harness_download "$base/SHASUMS256.txt" "$WORK/SHASUMS256.txt"
harness_sha256 "$WORK/$target.zip" "$(grep " $target.zip\$" "$WORK/SHASUMS256.txt" | cut -d' ' -f1)"
unzip -q "$WORK/$target.zip" -d "$WORK"
mkdir -p "$PREFIX/bin"
mv "$WORK/$target/bun" "$PREFIX/bin/bun"
ln -s bun "$PREFIX/bin/bunx"
harness_version "$("$PREFIX/bin/bun" --version)"
'''

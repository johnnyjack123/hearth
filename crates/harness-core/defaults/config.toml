# llm-harness: globale Einstellungen
#
# Projekte stehen in projects/<name>.toml. Harness-Definitionen (pi) sind
# eingebaut; eine Datei harnesses/<name>.toml ersetzt sie, nur anlegen, wenn
# du sie bewusst ändern willst. Dieser Ordner enthält sicherheitsrelevante
# Einstellungen (Netzwerk, Ressourcen) und darf deshalb nie in einem
# Projektordner liegen.

# Podman-Machine, in der die Container laufen
machine = "harness"

# Domains der LLM-Anbieter, die die Harnesse direkt ansprechen (pi:
# DeepSeek). Sie sind in jedem Projekt erreichbar, auch bei network = "off".
# Nach `harness login` laufen LLM-Anfragen über den harness-Server und
# brauchen diese Liste nicht. Weitere z. B. "api.anthropic.com",
# "api.openai.com" oder "openrouter.ai".
llm_apis = ["api.deepseek.com"]

# Der harness-Server mit deinen API-Keys. `harness login` trägt ihn ein und
# legt das Geräte-Token in der Windows-Anmeldeinformationsverwaltung ab.
# [server]
# url = "http://localhost:8080"
#
# Nutzt der Server per https:// ein Zertifikat einer eigenen CA (z. B. Caddy
# mit `tls internal`), hier das Wurzelzertifikat als PEM-Datei angeben,
# absoluter Pfad in einfachen Anführungszeichen. harness vertraut dem Server
# dann nur über diese CA, auf diesem Rechner und im Gateway. `harness logout`
# lässt den Eintrag stehen.
# ca = 'C:\Users\name\harness-root.crt'

# Prüfung vor `harness merge`. Die festen Regeln laufen immer.
[review]
# Neue Abhängigkeiten mit der OSV-Datenbank bekannter Schadpakete abgleichen.
# Schickt dafür die Paketnamen an api.osv.dev; false schaltet das ab.
osv = true

[defaults]
# Harness für `harness run` ohne Angabe
harness = "pi"

# Netzwerk-Voreinstellung für neue Projekte. Host, lokales Netz, Tailnet und
# VM sind immer gesperrt, auch bei "open".
#   off          nur die LLM-APIs
#   development  Paketquellen (npm, PyPI, crates.io, Go), GitHub, GitLab,
#                Bitbucket, die LLM-APIs und die allow-Liste des Projekts
#   open         gesamtes öffentliches Internet, z. B. für Recherche
#   custom       nur die LLM-APIs und die allow-Liste des Projekts
network = "development"

[defaults.resources]
# Grenzen pro Instanz. Die VM selbst hat höchstens 4 GB.
memory = "3g"
# cpus = 2

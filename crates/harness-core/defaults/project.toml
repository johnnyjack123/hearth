# Projekt „{name}“ für llm-harness
#
# Die Einstellungen stehen bewusst hier und nicht im Projektordner: Den kann
# der Agent über seine Commits verändern, sonst könnte er seine eigenen
# Regeln lockern.

# Git-Repository auf dem Host
path = ""

# Harness für `harness run` ohne Angabe (fehlt: Standard aus config.toml)
# default_harness = "pi"

[files]
# isolated: Der Agent arbeitet auf einem eigenen Klon in der VM. Commits
# kommen per `harness sync` als Branch agent/<projekt> zurück.
mode = "isolated"

[network]
# off | development | open | custom (siehe config.toml). Mit "open" kann der
# Agent frei im Internet recherchieren, aber auch alles, was er im Container
# sieht, nach außen schicken. Ändern: `harness net preset <name>`.
preset = "development"
# Nicht freigegebene Domains nachfragen: Die Anfrage wartet, bis du sie in
# `harness net watch` erlaubst oder ablehnst. Läuft kein `harness net watch`,
# wird sofort blockiert.
ask = true
# Zusätzlich erlaubte bzw. gesperrte Domains, z. B. "api.example.com" oder
# "*.example.com". deny gewinnt immer.
allow = []
deny = []

[remote]
# Für Web-Chats freigeben: Solange `harness connect` läuft, können Chats in
# der Web-App den Agent dieses Projekts steuern. Umschalten mit
# `harness project remote on|off`.
enabled = false
# Einen neuen Chat erst hier am Rechner bestätigen. Ohne Bestätigung könnte
# jeder, der dein Server-Konto nutzt, hier Agents starten.
confirm = true
# Bestätigte Chats; harness connect trägt sie ein.
chats = []

[resources]
# Fehlt ein Wert, gilt der Standard aus config.toml.
# memory = "2g"
# cpus = 2

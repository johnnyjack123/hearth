# Harness-Definition für pi
name = "pi"
description = "Minimaler Coding-Agent mit vielen LLM-Anbietern"

# Läuft in einem eigenen Container mit Netz über das Gateway. Ziel ist das
# gemeinsame Tools-Volume /opt/harness-tools, das Instanzen nur lesen.
install = "npm install -g @earendil-works/pi-coding-agent"

# Start im Arbeitsverzeichnis /workspace
command = ["pi"]

# Logins und Einstellungen, pro Nutzer über alle Projekte geteilt
persist = ["~/.pi"]

# Nach `harness login` schreibt harness ~/.pi/agent/models.json: Alle
# Anbieter aus der Web-App laufen dann über den harness-Server, ohne dass ein
# Key in den Container kommt. Ohne login bleibt pis eigene Anmeldung.
llm = "pi"

# Hängt harness' Hinweise zur Sandbox an pis System-Prompt an: Arbeitskopie,
# Commits, Netz über das Gateway. Ohne diese Zeile bekommt pi keine Hinweise.
prompt_flag = "--append-system-prompt"

# pi soll nicht von sich aus ins Netz: Updates installiert harness, und jede
# automatische Anfrage (Versionsprüfung bei pi.dev, Telemetrie) wäre eine
# Rückfrage des Gateways.
[env]
PI_SKIP_VERSION_CHECK = "1"
PI_TELEMETRY = "0"

# Nur für die Anbindung an den Web-Chat (Phase 4)
[adapter]
kind = "pi-rpc"
command = ["pi", "--mode", "rpc"]

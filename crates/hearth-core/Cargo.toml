[package]
name = "hearth-core"
description = "Sandbox core: providers, instances and configuration for hearth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hearth-gateway.workspace = true
getrandom.workspace = true
hmac.workspace = true
keyring.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true
ureq.workspace = true
tempfile.workspace = true
ignore.workspace = true
globset.workspace = true
regex.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
# German as the UI language unless HEARTH_LANG says otherwise, whatever
# Windows shows: for the tests of crates that depend on hearth-core, whose
# expected texts are German (lang.rs).
test-german = []


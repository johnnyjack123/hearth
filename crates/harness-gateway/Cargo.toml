[package]
name = "harness-gateway"
description = "Egress gateway of llm-harness instances: allowlist, address checks, approvals"
# Deliberately no workspace inheritance: the gateway image compiles this crate
# on its own inside the VM (images/gateway), with the pruned lock file
# images/gateway/Cargo.lock and `--locked`.
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"
publish = false

[[bin]]
name = "harness-gateway"
path = "src/main.rs"

[features]
# TLS to an https:// harness server (rustls with ring, Mozilla's roots
# compiled in). Off by default because ring needs clang to build for
# aarch64-pc-windows-msvc, and the host side (harness-core) only needs the
# protocol types; the gateway image always builds with it.
tls = ["dep:rustls", "dep:webpki-roots"]

# Only the TLS stack; everything else stays standard library. After changing
# a dependency, regenerate the gateway's lock file: scripts/gateway-lock.sh
[dependencies]
rustls = { version = "0.23.46", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "1.0.9", optional = true }

[package]
name = "harness-vmd"
description = "Windows service that starts and stops the Podman machine of llm-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
harness-core.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
# Tests expect German texts, also from harness-core (lang.rs).
harness-core = { workspace = true, features = ["test-german"] }

[package]
name = "hearth-vmd"
description = "Windows service that starts and stops the Podman machine of hearth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hearth-core.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
# Tests expect German texts, also from hearth-core (lang.rs).
hearth-core = { workspace = true, features = ["test-german"] }
